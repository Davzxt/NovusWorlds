<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Dashboard - Novus Worlds</title><link rel="stylesheet" href="/css/global.css"></head><body><div data-header></div><main class="wrap"><section class="panel"><h1>Meus Projetos</h1><p><a class="btn" href="/studio.html">Criar Novo Mundo</a></p><div id="projects" class="grid"></div></section></main><script type="module">import{api,esc}from'/js/main.js';const {games}=await api('/api/games/mine/list');projects.innerHTML=games.map(g=>`<div class="card"><div class="thumb"><img src="${g.thumbnail_url||'/assets/textures/game-default.svg'}"></div><h3>${esc(g.title)}</h3><p>${g.is_active?'Publicado':'Rascunho'}</p><p>${g.visit_count} visitas unicas</p><a class="btn" href="/studio.html?id=${g.id}">Continuar</a> <a class="btn secondary" href="/game-info.html?id=${g.id}">Detalhes</a></div>`).join('')||'<p>Voce ainda nao tem projetos.</p>';</script></body></html>
