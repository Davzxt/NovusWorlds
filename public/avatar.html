<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Editor - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .avatar-container { display: flex; gap: 20px; max-width: 1200px; margin: 30px auto; }
    .avatar-sidebar { width: 250px; }
    .avatar-preview { width: 300px; height: 400px; background: linear-gradient(180deg, #87CEEB 0%, #e0e0e0 100%); border-radius: 3px; }
    .avatar-main { flex: 1; }
    .color-palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 5px; }
    .color-swatch { width: 100%; aspect-ratio: 1; border: 2px solid #fff; border-radius: 3px; cursor: pointer; }
    .color-swatch:hover, .color-swatch.selected { border-color: #FFD700; transform: scale(1.1); }
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .inventory-item { background: #fff; padding: 10px; border-radius: 3px; text-align: center; cursor: pointer; transition: transform 0.2s; }
    .inventory-item:hover { transform: scale(1.05); }
    .inventory-item.equipped { border: 2px solid #4CAF50; }
    .inventory-item img { width: 80px; height: 80px; object-fit: contain; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/games.html">Games</a>
          <a href="/catalog.html">Catalog</a>
        </nav>
        <div class="header-right" id="header-right">
          <a href="/login.html" class="btn btn-secondary">Log In</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="avatar-container">
        <div class="avatar-sidebar">
          <h3 style="color:#fff;margin-bottom:15px;">Categories</h3>
          <div class="tabs" style="flex-direction:column;">
            <div class="tab active" data-category="colors">Body Colors</div>
            <div class="tab" data-category="hats">Hats</div>
            <div class="tab" data-category="faces">Faces</div>
            <div class="tab" data-category="shirts">Shirts</div>
            <div class="tab" data-category="pants">Pants</div>
          </div>
        </div>

        <div class="avatar-main">
          <div class="avatar-preview" id="avatar-preview"></div>
          <button class="btn btn-primary" id="save-btn" style="margin-top:15px;width:100%;">Save Avatar</button>
          <a href="/catalog.html" class="btn btn-secondary" style="margin-top:10px;width:100%;display:block;text-align:center;">Buy More Items</a>
        </div>

        <div class="avatar-sidebar">
          <div id="category-content"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const BODY_COLORS = [
      '#f5d0a8', '#8d5524', '#c68642', '#e0ac69', '#f1c27d', '#d6a668', '#b08d55', '#d2a679',
      '#6b4423', '#976833', '#7c5313', '#7e5f34', '#61441c', '#68422b', '#57412b', '#47321a',
      '#262626', '#52595e', '#7d7d7d', '#9e9e9e', '#aeaeae', '#c1c1c1', '#dcdcdc', '#ffffff',
      '#e6cea8', '#e5b887', '#be8c5e', '#b87d56', '#a66645', '#954e34', '#7d3f28', '#662e1f',
      '#bf3636', '#a01f1f', '#9e2929', '#7d1f1f', '#7d1414', '#501a1a', '#3d1212', '#7d0000',
      '#bf3636', '#a01f1f', '#9e2929', '#7d1f1f', '#7d1414', '#501a1a', '#3d1212', '#7d0000'
    ];

    let currentUser = null;
    let avatarData = {};
    let inventory = [];
    let scene, camera, renderer, avatar;

    async function checkSession() {
      const res = await fetch('/api/auth/session');
      const data = await res.json();
      if (!data.authenticated) {
        window.location.href = '/login.html';
      }
      currentUser = data.user;
      avatarData = data.user.avatarData || {};
    }

    async function loadInventory() {
      const res = await fetch('/api/catalog/user/inventory');
      inventory = await res.json();
      return inventory;
    }

    async function init() {
      await checkSession();
      await loadInventory();
      initThree();
      renderCategory('colors');
    }

    function initThree() {
      const container = document.getElementById('avatar-preview');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);

      camera = new THREE.PerspectiveCamera(50, 300/400, 0.1, 1000);
      camera.position.set(0, 2, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(300, 400);
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x404040);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(2, 3, 2);
      scene.add(dirLight);

      createAvatar();
      animate();
    }

    function createAvatar() {
      avatar = new THREE.Group();
      
      const head = avatarData.head || '#f5d0a8';
      const torso = avatarData.torso || '#f5d0a8';
      const leftArm = avatarData.left_arm || '#f5d0a8';
      const rightArm = avatarData.right_arm || '#f5d0a8';
      const leftLeg = avatarData.left_leg || '#f5d0a8';
      const rightLeg = avatarData.right_leg || '#f5d0a8';

      const headMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({ color: head })
      );
      headMesh.position.y = 2;
      avatar.add(headMesh);

      const torsoMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1.5, 0.5),
        new THREE.MeshStandardMaterial({ color: torso })
      );
      torsoMesh.position.y = 0.75;
      avatar.add(torsoMesh);

      const limbGeo = new THREE.BoxGeometry(0.4, 1.5, 0.4);
      
      const leftArmMesh = new THREE.Mesh(
        limbGeo,
        new THREE.MeshStandardMaterial({ color: leftArm })
      );
      leftArmMesh.position.set(-0.7, 0.75, 0);
      avatar.add(leftArmMesh);

      const rightArmMesh = new THREE.Mesh(
        limbGeo,
        new THREE.MeshStandardMaterial({ color: rightArm })
      );
      rightArmMesh.position.set(0.7, 0.75, 0);
      avatar.add(rightArmMesh);

      const leftLegMesh = new THREE.Mesh(
        limbGeo,
        new THREE.MeshStandardMaterial({ color: leftLeg })
      );
      leftLegMesh.position.set(-0.3, -0.75, 0);
      avatar.add(leftLegMesh);

      const rightLegMesh = new THREE.Mesh(
        limbGeo,
        new THREE.MeshStandardMaterial({ color: rightLeg })
      );
      rightLegMesh.position.set(0.3, -0.75, 0);
      avatar.add(rightLegMesh);

      scene.add(avatar);
      avatar.userData.meshes = { head: headMesh, torso: torsoMesh, leftArm: leftArmMesh, rightArm: rightArmMesh, leftLeg: leftLegMesh, rightLeg: rightLegMesh };
    }

    function updateAvatarColor(part, color) {
      avatarData[part] = color;
      const meshes = avatar.userData.meshes;
      
      if (part === 'head') meshes.head.material.color.set(color);
      else if (part === 'torso') meshes.torso.material.color.set(color);
      else if (part === 'left_arm') { meshes.leftArm.material.color.set(color); meshes.rightArm.material.color.set(color); }
      else if (part === 'left_leg') { meshes.leftLeg.material.color.set(color); meshes.rightLeg.material.color.set(color); }
    }

    function renderCategory(category) {
      const container = document.getElementById('category-content');
      
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.category === category);
      });

      if (category === 'colors') {
        container.innerHTML = `
          <div class="form-group">
            <label class="form-label">Head</label>
            <input type="color" id="color-head" value="${avatarData.head || '#f5d0a8'}">
          </div>
          <div class="form-group">
            <label class="form-label">Torso</label>
            <input type="color" id="color-torso" value="${avatarData.torso || '#f5d0a8'}">
          </div>
          <div class="form-group">
            <label class="form-label">Arms</label>
            <input type="color" id="color-arms" value="${avatarData.left_arm || '#f5d0a8'}">
          </div>
          <div class="form-group">
            <label class="form-label">Legs</label>
            <input type="color" id="color-legs" value="${avatarData.left_leg || '#f5d0a8'}">
          </div>
        `;

        container.querySelectorAll('input[type="color"]').forEach(input => {
          input.addEventListener('input', () => {
            if (input.id === 'color-head') updateAvatarColor('head', input.value);
            else if (input.id === 'color-torso') updateAvatarColor('torso', input.value);
            else if (input.id === 'color-arms') updateAvatarColor('left_arm', input.value);
            else if (input.id === 'color-legs') updateAvatarColor('left_leg', input.value);
          });
        });
      } else {
        const type = category === 'hats' ? 'hat' : category === 'faces' ? 'face' : category === 'shirts' ? 'shirt' : 'pants';
        const items = inventory.filter(i => i.type === type);
        
        if (items.length === 0) {
          container.innerHTML = `<p style="color:#666;">No ${type}s owned. <a href="/catalog.html">Buy some!</a></p>`;
          return;
        }

        container.innerHTML = `
          <div class="inventory-grid">
            ${items.map(item => `
              <div class="inventory-item ${isEquipped(item.id, type) ? 'equipped' : ''}" data-id="${item.id}" data-type="${type}">
                <img src="${item.thumbnail_url || '/assets/icons/default.png'}">
                <div style="font-size:11px;margin-top:5px;">${item.name}</div>
                <button class="btn btn-small ${isEquipped(item.id, type) ? 'btn-danger' : 'btn-primary'}">${isEquipped(item.id, type) ? 'Remove' : 'Equip'}</button>
              </div>
            `).join('')}
          </div>
        `;

        container.querySelectorAll('.inventory-item button').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const itemId = btn.parentElement.dataset.id;
            const type = btn.parentElement.dataset.type;
            
            const endpoint = btn.textContent === 'Remove' ? `/api/avatar/unequip/${itemId}` : `/api/avatar/equip/${itemId}`;
            
            await fetch(endpoint);
            renderCategory(category);
          });
        });
      }
    }

    function isEquipped(itemId, type) {
      if (type === 'hats') return avatarData.hat && avatarData.hat.includes(parseInt(itemId));
      if (type === 'faces') return avatarData.face === parseInt(itemId);
      if (type === 'shirts') return avatarData.shirt === parseInt(itemId);
      if (type === 'pants') return avatarData.pants === parseInt(itemId);
      return false;
    }

    function saveAvatar() {
      fetch('/api/avatar/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ avatarData })
      }).then(() => {
        showToast('Avatar saved!', 'success');
      });
    }

    function showToast(message, type) {
      const container = document.querySelector('.toast-container') || document.createElement('div');
      container.className = 'toast-container';
      document.body.appendChild(container);
      
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => toast.remove(), 3000);
    }

    function animate() {
      requestAnimationFrame(animate);
      avatar.rotation.y += 0.005;
      renderer.render(scene, camera);
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        renderCategory(tab.dataset.category);
      });
    });

    document.getElementById('save-btn').addEventListener('click', saveAvatar);

    init();
  </script>
</body>
</html>
