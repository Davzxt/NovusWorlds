<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
      </div>
    </div>
  </header>

  <main>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Log In</h2>
        </div>
        <div class="auth-body">
          <form id="login-form">
            <div class="form-group">
              <label class="form-label">Username</label>
              <input type="text" id="username" class="form-input" required autocomplete="username">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-input" required autocomplete="current-password">
            </div>
            <div id="login-error" class="form-error" style="color:red;margin-bottom:10px;"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">Log In</button>
          </form>
        </div>
        <div class="auth-footer">
          <p style="color:#333;">Don't have an account? <a href="/register.html">Sign Up</a></p>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      
      if (!username || !password) {
        errorEl.textContent = 'Please fill in all fields';
        return;
      }
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          errorEl.textContent = data.error || 'Login failed';
          return;
        }
        
        if (data.success) {
          window.location.href = '/';
        } else {
          errorEl.textContent = data.error || 'Login failed';
        }
      } catch (error) {
        errorEl.textContent = 'Connection error. Please try again.';
        console.error(error);
      }
    });
  </script>
</body>
</html>
