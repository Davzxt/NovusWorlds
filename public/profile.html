<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil - Novus Worlds</title><link rel="stylesheet" href="/css/global.css"></head><body><div data-header></div><main class="wrap"><section class="panel" id="profile"></section></main><script type="module">import{api,esc,gameCard,currentUser,toast}from'/js/main.js';const u=new URLSearchParams(location.search).get('user');const me=await currentUser();const r=await api('/api/users/'+encodeURIComponent(u));const p=document.getElementById('profile');p.innerHTML=`<div class="grid"><div id="avatar3d" style="height:330px;background:#777"></div><div><h1>${esc(r.user.username)} ${r.user.is_admin?'<span class="btn secondary">Novus Worlds</span>':''}</h1><p>Criado em ${new Date(r.user.created_at).toLocaleDateString()}</p>${me&&me.username===r.user.username?`<p class="novux">Saldo: Ƀ ${r.user.novux}</p>`:'<button id="friend">Adicionar Amigo</button> <button class="secondary">Enviar Mensagem</button>'}<div class="tabs"><button class="tab active">Jogos Criados</button><button class="tab">Colecao</button><button class="tab">Amigos</button><button class="tab">Feed</button></div><div id="tabbody"></div></div></div>`;document.getElementById('tabbody').innerHTML='<div class="grid">'+r.games.map(gameCard).join('')+'</div>';document.getElementById('friend')?.addEventListener('click',async()=>{await api('/api/users/'+encodeURIComponent(u)+'/friend',{method:'POST'});toast('Pedido enviado.')});import('/js/r6-viewer.js').then(m=>m.createR6Viewer(document.getElementById('avatar3d'),{avatar:r.user.avatar_data}));</script></body></html>
