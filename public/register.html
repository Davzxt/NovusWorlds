<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar - Novus Worlds</title><link rel="stylesheet" href="/css/global.css"></head><body><div data-header></div><main class="wrap"><section class="panel form"><h1>Registrar</h1><form id="registerForm"><label class="field"><span>Username</span><input name="username" pattern="[A-Za-z0-9_]{3,20}" required></label><label class="field"><span>Senha</span><input name="password" type="password" minlength="8" required></label><label class="field"><span>Confirmar senha</span><input name="confirm" type="password" minlength="8" required></label><label class="field"><span>Data de nascimento</span><input name="birthdate" type="date" required></label><p><button>Registrar</button></p></form></section></main><script type="module" src="/js/auth.js"></script></body></html>
