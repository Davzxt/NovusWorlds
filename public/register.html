<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    body { background: var(--bg-primary); }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
      </div>
    </div>
  </header>

  <main>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Sign Up</h2>
        </div>
        <div class="auth-body">
          <form id="register-form">
            <div class="form-group">
              <label class="form-label">Username *</label>
              <input type="text" id="username" class="form-input" required minlength="3" maxlength="20">
              <small style="color:#666;">3-20 characters, no spaces</small>
            </div>
            <div class="form-group">
              <label class="form-label">Password *</label>
              <input type="password" id="password" class="form-input" required minlength="8">
              <small style="color:#666;">At least 8 characters</small>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password *</label>
              <input type="password" id="confirm-password" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email (optional)</label>
              <input type="email" id="email" class="form-input">
            </div>
            <div id="register-error" class="form-error"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:15px;">Create Account</button>
          </form>
        </div>
        <div class="auth-footer">
          <p>Already have an account? <a href="/login.html">Log In</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
