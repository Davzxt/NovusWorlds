<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
      </div>
    </div>
  </header>

  <main>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Sign Up</h2>
        </div>
        <div class="auth-body">
          <form id="register-form">
            <div class="form-group">
              <label class="form-label">Username</label>
              <input type="text" id="username" class="form-input" required minlength="3" maxlength="20" autocomplete="username">
              <small style="color:#666;font-size:10px;">3-20 characters, no spaces</small>
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="password" class="form-input" required minlength="8" autocomplete="new-password">
              <small style="color:#666;font-size:10px;">At least 8 characters</small>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password</label>
              <input type="password" id="confirm-password" class="form-input" required autocomplete="new-password">
            </div>
            <div class="form-group">
              <label class="form-label">Email (optional)</label>
              <input type="email" id="email" class="form-input" autocomplete="email">
            </div>
            <div id="register-error" class="form-error" style="color:red;margin-bottom:10px;"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">Create Account</button>
          </form>
        </div>
        <div class="auth-footer">
          <p style="color:#333;">Already have an account? <a href="/login.html">Log In</a></p>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const email = document.getElementById('email').value.trim();
      const errorEl = document.getElementById('register-error');
      
      if (!username || !password || !confirmPassword) {
        errorEl.textContent = 'Please fill in all required fields';
        return;
      }
      
      if (username.length < 3 || username.length > 20) {
        errorEl.textContent = 'Username must be 3-20 characters';
        return;
      }
      
      if (/\s/.test(username)) {
        errorEl.textContent = 'Username cannot contain spaces';
        return;
      }
      
      if (password.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters';
        return;
      }
      
      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match';
        return;
      }
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, confirmPassword, email })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          errorEl.textContent = data.error || 'Registration failed';
          return;
        }
        
        if (data.success) {
          window.location.href = '/';
        } else {
          errorEl.textContent = data.error || 'Registration failed';
        }
      } catch (error) {
        errorEl.textContent = 'Connection error. Please try again.';
        console.error(error);
      }
    });
  </script>
</body>
</html>
