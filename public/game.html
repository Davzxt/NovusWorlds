<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/game.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #000; }
    #game-canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-content">
      <h1>Novus Worlds</h1>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p id="loading-text">Loading...</p>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="hud" class="hidden">
    <div id="game-title"></div>
    <div id="player-count">0 players</div>
    <div id="chat-container">
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Press Enter to chat...">
    </div>
    <button id="exit-btn" class="btn btn-danger btn-small">Exit</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('game-canvas');
    const gameId = new URLSearchParams(window.location.search).get('id');
    let currentUser = null;
    let gameSocket = null;
    let scene, camera, renderer, player;
    let players = new Map();
    let keys = {};
    let moveSpeed = 0.15;
    let runSpeed = 0.3;
    let velocity = new THREE.Vector3();
    let isGrounded = false;

    async function init() {
      updateProgress(10, 'Loading game data...');
      
      const sessionRes = await fetch('/api/auth/session');
      const session = await sessionRes.json();
      if (!session.authenticated) {
        window.location.href = '/login.html';
        return;
      }
      currentUser = session.user;
      
      const gameRes = await fetch(`/api/games/${gameId}`);
      const gameData = await gameRes.json();
      const game = gameData.game;
      
      if (!game) {
        window.location.href = '/games.html';
        return;
      }
      
      document.getElementById('game-title').textContent = game.title;
      
      updateProgress(30, 'Creating world...');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.Fog(0x87CEEB, 50, 200);
      
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 10, 20);
      
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      
      const ambientLight = new THREE.AmbientLight(0x404040);
      scene.add(ambientLight);
      
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(50, 100, 50);
      dirLight.castShadow = true;
      scene.add(dirLight);
      
      updateProgress(50, 'Loading map...');
      
      try {
        const mapData = JSON.parse(game.map_data);
        loadMap(mapData);
      } catch (e) {
        createDefaultMap();
      }
      
      updateProgress(70, 'Creating character...');
      
      player = createR6Player(currentUser.avatarData);
      player.position.set(0, 5, 0);
      scene.add(player);
      
      updateProgress(90, 'Connecting...');
      
      connectWebSocket();
      
      updateProgress(100, 'Ready!');
      
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      
      setupControls();
      animate();
    }

    function loadMap(mapData) {
      if (!mapData.objects) {
        createDefaultMap();
        return;
      }
      
      mapData.objects.forEach(obj => {
        if (obj.type === 'Part') {
          const geometry = new THREE.BoxGeometry(obj.size?.x || 1, obj.size?.y || 1, obj.size?.z || 1);
          const material = new THREE.MeshStandardMaterial({ 
            color: obj.color || 0x6B8E23,
            transparent: obj.transparency < 1,
            opacity: 1 - (obj.transparency || 0)
          });
          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set(obj.position?.x || 0, obj.position?.y || 0, obj.position?.z || 0);
          mesh.rotation.set(
            THREE.MathUtils.degToRad(obj.rotation?.x || 0),
            THREE.MathUtils.degToRad(obj.rotation?.y || 0),
            THREE.MathUtils.degToRad(obj.rotation?.z || 0)
          );
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          mesh.userData.canCollide = obj.canCollide !== false;
          scene.add(mesh);
        }
      });
      
      if (mapData.skyColor) {
        scene.background = new THREE.Color(mapData.skyColor);
      }
    }

    function createDefaultMap() {
      const groundGeo = new THREE.PlaneGeometry(512, 512);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x6B8E23 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
    }

    function createR6Player(avatarData) {
      const group = new THREE.Group();
      const color = avatarData?.head || '#f5d0a8';
      
      const torsoGeo = new THREE.BoxGeometry(1, 1.5, 0.5);
      const torsoMat = new THREE.MeshStandardMaterial({ color: avatarData?.torso || color });
      const torso = new THREE.Mesh(torsoGeo, torsoMat);
      torso.position.y = 0.75;
      torso.castShadow = true;
      group.add(torso);
      
      const headGeo = new THREE.BoxGeometry(1, 1, 1);
      const headMat = new THREE.MeshStandardMaterial({ color });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 2;
      head.castShadow = true;
      group.add(head);
      
      const limbGeo = new THREE.BoxGeometry(0.4, 1.5, 0.4);
      const limbMat = new THREE.MeshStandardMaterial({ color: avatarData?.left_arm || color });
      
      const leftArm = new THREE.Mesh(limbGeo, limbMat);
      leftArm.position.set(-0.7, 0.75, 0);
      group.add(leftArm);
      
      const rightArm = new THREE.Mesh(limbGeo, limbMat.clone());
      rightArm.position.set(0.7, 0.75, 0);
      group.add(rightArm);
      
      const legMat = new THREE.MeshStandardMaterial({ color: avatarData?.left_leg || color });
      const leftLeg = new THREE.Mesh(limbGeo, legMat);
      leftLeg.position.set(-0.3, -0.75, 0);
      group.add(leftLeg);
      
      const rightLeg = new THREE.Mesh(limbGeo, legMat.clone());
      rightLeg.position.set(0.3, -0.75, 0);
      group.add(rightLeg);
      
      return group;
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/game/${gameId}`;
      gameSocket = new WebSocket(wsUrl);
      
      gameSocket.onopen = () => {
        gameSocket.send(JSON.stringify({
          type: 'join',
          userId: currentUser.id,
          username: currentUser.username,
          avatarData: currentUser.avatarData
        }));
      };
      
      gameSocket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        handleServerMessage(msg);
      };
      
      gameSocket.onclose = () => {
        showToast('Disconnected from server');
        window.location.href = '/games.html';
      };
    }

    function handleServerMessage(msg) {
      switch (msg.type) {
        case 'world_state':
          msg.players.forEach(p => updateRemotePlayer(p));
          document.getElementById('player-count').textContent = `${msg.players.length + 1} players`;
          break;
        case 'player_join':
          updateRemotePlayer(msg.player);
          break;
        case 'player_leave':
          players.delete(msg.playerId);
          break;
        case 'player_update':
          const p = players.get(msg.playerId);
          if (p) {
            p.position.copy(msg.position);
            p.rotation.copy(msg.rotation);
          }
          break;
        case 'chat_broadcast':
          addChatMessage(msg.from, msg.message);
          break;
        case 'error':
          showToast(msg.message, 'error');
          break;
      }
    }

    function updateRemotePlayer(data) {
      let p = players.get(data.id);
      if (!p) {
        p = createR6Player(data.avatarData);
        players.set(data.id, p);
        scene.add(p);
      }
      p.position.set(data.position.x, data.position.y, data.position.z);
    }

    function addChatMessage(username, message) {
      const container = document.getElementById('chat-messages');
      const msg = document.createElement('div');
      msg.innerHTML = `<strong>${username}:</strong> ${message}`;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
      
      setTimeout(() => msg.remove(), 5000);
    }

    function setupControls() {
      document.addEventListener('keydown', (e) => { keys[e.code] = true; });
      document.addEventListener('keyup', (e) => { keys[e.code] = false; });
      
      document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value) {
          gameSocket.send(JSON.stringify({ type: 'chat', message: e.target.value }));
          addChatMessage(currentUser.username, e.target.value);
          e.target.value = '';
        }
      });
      
      document.getElementById('exit-btn').addEventListener('click', () => {
        gameSocket.send(JSON.stringify({ type: 'leave' }));
        window.location.href = '/games.html';
      });
      
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      
      const speed = keys['ShiftLeft'] ? runSpeed : moveSpeed;
      
      if (keys['KeyW']) player.position.z -= speed;
      if (keys['KeyS']) player.position.z += speed;
      if (keys['KeyA']) player.position.x -= speed;
      if (keys['KeyD']) player.position.x += speed;
      
      if (keys['Space'] && isGrounded) {
        velocity.y = 0.3;
        isGrounded = false;
      }
      
      velocity.y -= 0.015;
      player.position.y += velocity.y;
      
      if (player.position.y < 0) {
        player.position.y = 0;
        velocity.y = 0;
        isGrounded = true;
      }
      
      camera.position.set(player.position.x, player.position.y + 5, player.position.z + 10);
      camera.lookAt(player.position);
      
      if (gameSocket && gameSocket.readyState === WebSocket.OPEN) {
        gameSocket.send(JSON.stringify({
          type: 'move',
          position: player.position,
          rotation: player.rotation,
          animation: keys['KeyW'] || keys['KeyS'] ? 'walk' : 'idle'
        }));
      }
      
      renderer.render(scene, camera);
    }

    function updateProgress(percent, text) {
      document.getElementById('progress-fill').style.width = `${percent}%`;
      document.getElementById('loading-text').textContent = text;
    }

    function showToast(message, type = 'info') {
      const container = document.querySelector('.toast-container') || document.createElement('div');
      container.className = 'toast-container';
      container.style.position = 'fixed';
      container.style.top = '20px';
      container.style.right = '20px';
      document.body.appendChild(container);
      
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => toast.remove(), 3000);
    }

    init();
  </script>
</body>
</html>
