<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/games.html">Games</a>
          <a href="/catalog.html">Catalog</a>
        </nav>
        <div class="header-right" id="header-right">
          <div class="logged-out">
            <a href="/login.html" class="btn btn-secondary">Log In</a>
            <a href="/register.html" class="btn btn-primary">Sign Up</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="filters">
        <div class="filter-group">
          <label style="color:#fff;">Type:</label>
          <select id="type-filter" class="filter-select">
            <option value="">All</option>
            <option value="hat">Hats</option>
            <option value="face">Faces</option>
            <option value="shirt">Shirts</option>
            <option value="pants">Pants</option>
          </select>
        </div>
        <div class="filter-group">
          <label style="color:#fff;">Sort:</label>
          <select id="sort-filter" class="filter-select">
            <option value="recent">Most Recent</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="popular">Most Popular</option>
          </select>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Search items...">
        <button id="search-btn" class="btn btn-secondary">Search</button>
      </div>

      <div class="card-grid" id="catalog-items">
        <div class="loading"><div class="spinner"></div></div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <p class="footer-copyright">© 2008 Novus Worlds</p>
      </div>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    async function loadItems(page = 1) {
      const type = document.getElementById('type-filter').value;
      const sort = document.getElementById('sort-filter').value;
      const search = document.getElementById('search-input').value;
      
      try {
        const response = await fetch(`/api/catalog?type=${type}&sort=${sort}&search=${encodeURIComponent(search)}&page=${page}`);
        const data = await response.json();
        const container = document.getElementById('catalog-items');
        
        if (data.items.length === 0) {
          container.innerHTML = '<p style="color:#fff;grid-column:1/-1;text-align:center;">No items found</p>';
          return;
        }
        
        container.innerHTML = data.items.map(item => `
          <div class="card-item" onclick="window.location.href='/item.html?id=${item.id}'">
            <div class="card-thumbnail">
              ${item.thumbnail_url ? `<img src="${item.thumbnail_url}">` : '<span style="color:#999;">No Image</span>'}
            </div>
            <div class="card-info">
              <div class="card-title">${item.name}</div>
              <div class="card-meta">by ${item.creator_username}</div>
              <div class="card-price">${item.price} Ƀ</div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('catalog-items').innerHTML = '<p style="color:#fff;">Error loading items</p>';
      }
    }

    document.getElementById('type-filter').addEventListener('change', () => loadItems(1));
    document.getElementById('sort-filter').addEventListener('change', () => loadItems(1));
    document.getElementById('search-btn').addEventListener('click', () => loadItems(1));
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadItems(1);
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadItems();
    });
  </script>
</body>
</html>
