<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogos - Novus Worlds</title><link rel="stylesheet" href="/css/global.css"></head><body><div data-header></div><main class="wrap"><section class="panel"><h1>Jogos</h1><form id="gameFilters" class="grid"><input name="q" placeholder="Buscar por nome"><select name="sort"><option value="played">Mais Jogados</option><option value="recent">Mais Recentes</option><option value="featured">Destaque</option></select></form><div class="grid" id="gamesGrid"></div></section></main><script type="module">import{api,gameCard}from'/js/main.js';const f=document.getElementById('gameFilters'),g=document.getElementById('gamesGrid');async function load(){const r=await api('/api/games?'+new URLSearchParams(new FormData(f)));g.innerHTML=r.games.map(gameCard).join('')}f.oninput=load;load();</script></body></html>
