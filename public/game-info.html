<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogo - Novus Worlds</title><link rel="stylesheet" href="/css/global.css"></head><body><div data-header></div><main class="wrap"><section id="gameInfo" class="panel"></section></main><script type="module">import{api,esc,toast}from'/js/main.js';const id=new URLSearchParams(location.search).get('id');const {game}=await api('/api/games/'+id);gameInfo.innerHTML=`<div class="grid" style="grid-template-columns:360px 1fr"><div><div class="thumb" style="height:230px"><img src="${game.thumbnail_url||'/assets/textures/game-default.svg'}" alt=""></div><p><a class="btn" href="/game.html?id=${game.id}">Jogar</a> <a class="btn secondary" href="/studio.html?id=${game.id}">Abrir no Studio</a></p></div><div><h1>${esc(game.title)}</h1><p class="muted">Criador: <a href="/profile.html?user=${encodeURIComponent(game.creator)}">${esc(game.creator)}</a></p><p>${esc(game.description||'Sem descricao.')}</p><p>${game.visit_count||0} visitas unicas</p><p><button id="like">Gostei (${game.likes||0})</button> <button id="dislike" class="danger">Nao gostei (${game.dislikes||0})</button></p><h3>Informacoes</h3><table class="table"><tr><th>Status</th><td>${game.is_active?'Publicado':'Rascunho'}</td></tr><tr><th>Max players</th><td>${game.max_players}</td></tr><tr><th>Criado</th><td>${new Date(game.created_at).toLocaleString()}</td></tr><tr><th>Atualizado</th><td>${new Date(game.updated_at).toLocaleString()}</td></tr></table></div></div>`;like.onclick=async()=>{try{await api('/api/games/'+id+'/vote',{method:'POST',body:JSON.stringify({value:1})});toast('Voto salvo.')}catch(e){toast(e.message)}};dislike.onclick=async()=>{try{await api('/api/games/'+id+'/vote',{method:'POST',body:JSON.stringify({value:-1})});toast('Voto salvo.')}catch(e){toast(e.message)}};</script></body></html>
