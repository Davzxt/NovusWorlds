<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    body { background: var(--bg-dark); }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/games.html">Games</a>
          <a href="/catalog.html">Catalog</a>
          <a href="/profile.html">Profile</a>
        </nav>
        <div class="header-right" id="header-right"></div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <h1 class="section-title">Account Settings</h1>
      
      <div class="settings-container">
        <div class="settings-section">
          <h3>Profile</h3>
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" id="settings-username" class="form-input" readonly>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" id="settings-email" class="form-input">
          </div>
          <button class="btn btn-primary" id="save-profile-btn">Save Changes</button>
        </div>

        <div class="settings-section">
          <h3>Password</h3>
          <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" id="current-pw" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" id="new-pw" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" id="confirm-pw" class="form-input">
          </div>
          <button class="btn btn-primary" id="change-pw-btn">Change Password</button>
        </div>

        <div class="settings-section">
          <h3>Privacy & Safety</h3>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
              <input type="checkbox" id="allow-friends">
              <span style="color:var(--text-dark);">Allow friend requests</span>
            </label>
          </div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
              <input type="checkbox" id="allow-messages">
              <span style="color:var(--text-dark);">Allow messages</span>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <h3>Blocked Users</h3>
          <p style="color:var(--text-muted);">No blocked users</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function loadSettings() {
      try {
        const res = await fetch('/api/auth/session');
        const data = await res.json();
        
        if (!data.authenticated) {
          location.href = '/login.html';
          return;
        }
        
        document.getElementById('settings-username').value = data.user.username;
      } catch (err) {
        location.href = '/login.html';
      }
    }

    document.getElementById('save-profile-btn').addEventListener('click', () => {
      showToast('Settings saved!', 'success');
    });

    document.getElementById('change-pw-btn').addEventListener('click', () => {
      const np = document.getElementById('new-pw').value;
      const cp = document.getElementById('confirm-pw').value;
      if (np !== cp) {
        showToast('Passwords do not match', 'error');
        return;
      }
      showToast('Password changed!', 'success');
    });

    function showToast(msg, type) {
      let c = document.querySelector('.toast-container');
      if (!c) {
        c = document.createElement('div');
        c.className = 'toast-container';
        document.body.appendChild(c);
      }
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    document.addEventListener('DOMContentLoaded', loadSettings);
  </script>
</body>
</html>
