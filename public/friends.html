<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amigos - Novus Worlds</title><link rel="stylesheet" href="/css/global.css"></head>
<body><div data-header></div><main class="wrap"><section class="panel"><h1>Amigos</h1><h2>Pedidos</h2><div id="pending"></div><h2>Lista</h2><div id="friends"></div></section></main><script type="module">import{api,esc,toast}from'/js/main.js';async function load(){const d=await api('/api/users/me/friends');pending.innerHTML=d.pending.length?d.pending.map(p=>`<p>${esc(p.requester)} <button data-id="${p.id}" data-a="accept">Aceitar</button> <button class="danger" data-id="${p.id}" data-a="decline">Recusar</button></p>`).join(''):'<p class="muted">Sem pedidos.</p>';friends.innerHTML=d.friends.length?'<table class="table">'+d.friends.map(f=>`<tr><td>${esc(f.username)}</td><td>${f.last_login?'Online recente':'Offline'}</td><td><a class="btn secondary" href="/profile.html?user=${encodeURIComponent(f.username)}">Perfil</a></td></tr>`).join('')+'</table>':'<p class="muted">Sem amigos ainda.</p>'}pending.onclick=async e=>{if(!e.target.dataset.id)return;await api('/api/users/friends/'+e.target.dataset.id+'/action',{method:'POST',body:JSON.stringify({action:e.target.dataset.a})});toast('Atualizado.');load()};load();</script></body>
</html>
