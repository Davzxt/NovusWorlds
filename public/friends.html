<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/games.html">Games</a>
          <a href="/catalog.html">Catalog</a>
          <a href="/profile.html">Profile</a>
        </nav>
        <div class="header-right" id="header-right"></div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <h1 class="section-title">Friends</h1>
      
      <div class="tabs">
        <div class="tab active" data-tab="friends">All Friends</div>
        <div class="tab" data-tab="requests">Requests</div>
        <div class="tab" data-tab="find">Find Friends</div>
      </div>

      <div id="friends-list" class="card-grid"></div>
      <div id="requests-list" class="card-grid hidden"></div>
      <div id="find-section" class="hidden">
        <div class="search-box">
          <input type="text" id="find-input" class="search-input" placeholder="Search users...">
          <button class="btn btn-primary" id="find-btn">Search</button>
        </div>
        <div id="search-results" class="card-grid"></div>
      </div>

      <div id="empty-state" style="text-align:center;padding:40px;color:var(--text-muted);">
        <p>No friends yet</p>
      </div>
    </div>
  </main>

  <script>
    async function loadFriends() {
      try {
        const res = await fetch('/api/auth/session');
        const data = await res.json();
        if (!data.authenticated) {
          location.href = '/login.html';
          return;
        }

        const friendsRes = await fetch('/api/users/friends');
        const friendsData = await friendsRes.json();
        
        const friendsEl = document.getElementById('friends-list');
        const emptyEl = document.getElementById('empty-state');

        if (friendsData.friendships && friendsData.friendships.length > 0) {
          emptyEl.style.display = 'none';
          friendsEl.innerHTML = friendsData.friendships.map(f => `
            <div class="card-item" onclick="location.href='/profile.html?user=${f.friend_username}'">
              <div class="card-thumbnail">👤</div>
              <div class="card-info">
                <div class="card-title">${f.friend_username}</div>
                <div class="card-meta">${f.last_login ? 'Online' : 'Offline'}</div>
              </div>
            </div>
          `).join('');
        }

        const reqEl = document.getElementById('requests-list');
        if (friendsData.pendingRequests && friendsData.pendingRequests.length > 0) {
          reqEl.innerHTML = friendsData.pendingRequests.map(r => `
            <div class="card-item">
              <div class="card-thumbnail">👤</div>
              <div class="card-info">
                <div class="card-title">${r.username}</div>
                <button class="btn btn-primary btn-small" onclick="acceptReq(${r.id})">Accept</button>
                <button class="btn btn-secondary btn-small" onclick="declineReq(${r.id})">Decline</button>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function acceptReq(id) {
      await fetch('/api/users/friend/accept', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({requestId: id})
      });
      location.reload();
    }

    async function declineReq(id) {
      await fetch('/api/users/friend/decline', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({requestId: id})
      });
      location.reload();
    }

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        
        const tab = t.dataset.tab;
        document.getElementById('friends-list').classList.toggle('hidden', tab !== 'friends');
        document.getElementById('requests-list').classList.toggle('hidden', tab !== 'requests');
        document.getElementById('find-section').classList.toggle('hidden', tab !== 'find');
      });
    });

    document.getElementById('find-btn').addEventListener('click', async () => {
      const username = document.getElementById('find-input').value;
      if (!username) return;
      
      try {
        const res = await fetch(`/api/users/${username}`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('search-results').innerHTML = `
            <div class="card-item">
              <div class="card-thumbnail">👤</div>
              <div class="card-info">
                <div class="card-title">${data.user.username}</div>
                <button class="btn btn-primary btn-small" onclick="addFriend('${data.user.username}')">Add Friend</button>
              </div>
            </div>
          `;
        }
      } catch (err) {
        showToast('User not found', 'error');
      }
    });

    async function addFriend(username) {
      await fetch('/api/users/friend/add', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username})
      });
      showToast('Friend request sent!', 'success');
    }

    function showToast(msg, type) {
      let c = document.querySelector('.toast-container') || document.body.appendChild(document.createElement('div'));
      c.className = 'toast-container';
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    document.addEventListener('DOMContentLoaded', loadFriends);
  </script>
</body>
</html>
