<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/studio.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; overflow: hidden; }
    #studio-container { display: flex; height: 100vh; }
  </style>
</head>
<body>
  <div id="studio-toolbar">
    <div class="toolbar-group">
      <button class="tool-btn active" data-tool="select" title="Select (Q)">Select</button>
      <button class="tool-btn" data-tool="move" title="Move (G)">Move</button>
      <button class="tool-btn" data-tool="rotate" title="Rotate (R)">Rotate</button>
      <button class="tool-btn" data-tool="scale" title="Scale (S)">Scale</button>
    </div>
    <div class="toolbar-group">
      <button class="tool-btn" data-tool="part" title="Part (P)">Part</button>
      <button class="tool-btn" data-tool="script" title="Script">Script</button>
    </div>
    <div class="toolbar-group">
      <button class="tool-btn" id="save-btn" title="Save (Ctrl+S)">Save</button>
      <button class="tool-btn" id="publish-btn">Publish</button>
      <button class="tool-btn" id="test-btn">Test</button>
    </div>
  </div>

  <div id="studio-container">
    <div id="toolbox">
      <h3>Toolbox</h3>
      <div class="toolbox-section">
        <h4>Parts</h4>
        <div class="toolbox-item" data-type="Part" data-shape="box">Box</div>
        <div class="toolbox-item" data-type="Part" data-shape="sphere">Sphere</div>
        <div class="toolbox-item" data-type="Part" data-shape="cylinder">Cylinder</div>
      </div>
    </div>

    <div id="viewport">
      <canvas id="viewport-canvas"></canvas>
    </div>

    <div id="properties-panel">
      <h3>Properties</h3>
      <div id="properties-content"></div>
    </div>

    <div id="explorer">
      <h3>Explorer</h3>
      <div id="explorer-tree"></div>
    </div>
  </div>

  <div id="output-panel">
    <h3>Output</h3>
    <div id="output-content"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    let scene, camera, renderer;
    let selectedObject = null;
    let currentTool = 'select';
    let objects = [];
    let isDragging = false;
    let dragPlane = new THREE.Plane();
    let dragOffset = new THREE.Vector3();

    async function checkSession() {
      const res = await fetch('/api/auth/session');
      const data = await res.json();
      if (!data.authenticated) {
        window.location.href = '/login.html';
      }
      return data.user;
    }

    async function init() {
      const user = await checkSession();
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      
      camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
      camera.position.set(20, 15, 20);
      camera.lookAt(0, 0, 0);
      
      const canvas = document.getElementById('viewport-canvas');
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(800, 600);
      renderer.shadowMap.enabled = true;
      
      const ambientLight = new THREE.AmbientLight(0x404040);
      scene.add(ambientLight);
      
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(50, 100, 50);
      dirLight.castShadow = true;
      scene.add(dirLight);
      
      createGrid();
      createBaseplate();
      
      setupInteractions();
      animate();
    }

    function createGrid() {
      const gridHelper = new THREE.GridHelper(512, 512, 0x444444, 0x222222);
      scene.add(gridHelper);
    }

    function createBaseplate() {
      const geo = new THREE.BoxGeometry(512, 1, 512);
      const mat = new THREE.MeshStandardMaterial({ color: 0x6B8E23 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = -0.5;
      mesh.receiveShadow = true;
      mesh.userData.name = 'Baseplate';
      mesh.userData.canCollide = true;
      mesh.userData.anchored = true;
      scene.add(mesh);
      objects.push(mesh);
      updateExplorer();
    }

    function createPart(shape = 'box', position = new THREE.Vector3(0, 1, 0)) {
      let geo;
      switch (shape) {
        case 'sphere': geo = new THREE.SphereGeometry(1); break;
        case 'cylinder': geo = new THREE.CylinderGeometry(1, 1, 2); break;
        default: geo = new THREE.BoxGeometry(2, 2, 2);
      }
      
      const mat = new THREE.MeshStandardMaterial({ color: 0x2196F3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(position);
      mesh.castShadow = true;
      mesh.userData.name = `Part ${objects.length}`;
      mesh.userData.canCollide = true;
      mesh.userData.anchored = false;
      scene.add(mesh);
      objects.push(mesh);
      selectObject(mesh);
      updateExplorer();
    }

    function selectObject(obj) {
      if (selectedObject) {
        selectedObject.material.emissive?.setHex(0x000000);
      }
      
      selectedObject = obj;
      
      if (obj && obj.material) {
        obj.material.emissive = new THREE.Color(0xffff00);
        obj.material.emissiveIntensity = 0.3;
      }
      
      updateProperties();
    }

    function updateProperties() {
      const container = document.getElementById('properties-content');
      
      if (!selectedObject) {
        container.innerHTML = '<p style="color:#888;">Select an object</p>';
        return;
      }
      
      const data = selectedObject.userData;
      container.innerHTML = `
        <div class="prop-group">
          <label>Name</label>
          <input type="text" id="prop-name" value="${data.name || ''}">
        </div>
        <div class="prop-group">
          <label>Position</label>
          <div class="prop-xyz">
            <input type="number" id="prop-x" value="${selectedObject.position.x.toFixed(2)}" step="0.1">
            <input type="number" id="prop-y" value="${selectedObject.position.y.toFixed(2)}" step="0.1">
            <input type="number" id="prop-z" value="${selectedObject.position.z.toFixed(2)}" step="0.1">
          </div>
        </div>
        <div class="prop-group">
          <label>Size</label>
          <div class="prop-xyz">
            <input type="number" id="prop-sx" value="${selectedObject.scale.x.toFixed(2)}" step="0.1">
            <input type="number" id="prop-sy" value="${selectedObject.scale.y.toFixed(2)}" step="0.1">
            <input type="number" id="prop-sz" value="${selectedObject.scale.z.toFixed(2)}" step="0.1">
          </div>
        </div>
        <div class="prop-group">
          <label>Color</label>
          <input type="color" id="prop-color" value="#${selectedObject.material.color.getHexString()}">
        </div>
        <div class="prop-group">
          <label>Anchored</label>
          <input type="checkbox" id="prop-anchored" ${data.anchored ? 'checked' : ''}>
        </div>
      `;
      
      container.querySelectorAll('input').forEach(input => {
        input.addEventListener('change', () => {
          if (input.id === 'prop-name') {
            selectedObject.userData.name = input.value;
          } else if (input.id === 'prop-x') {
            selectedObject.position.x = parseFloat(input.value);
          } else if (input.id === 'prop-y') {
            selectedObject.position.y = parseFloat(input.value);
          } else if (input.id === 'prop-z') {
            selectedObject.position.z = parseFloat(input.value);
          } else if (input.id === 'prop-sx') {
            selectedObject.scale.x = parseFloat(input.value);
          } else if (input.id === 'prop-sy') {
            selectedObject.scale.y = parseFloat(input.value);
          } else if (input.id === 'prop-sz') {
            selectedObject.scale.z = parseFloat(input.value);
          } else if (input.id === 'prop-color') {
            selectedObject.material.color.set(input.value);
          } else if (input.id === 'prop-anchored') {
            selectedObject.userData.anchored = input.checked;
          }
        });
      });
    }

    function updateExplorer() {
      const container = document.getElementById('explorer-tree');
      container.innerHTML = objects.map((obj, i) => `
        <div class="tree-item" data-index="${i}">${obj.userData.name}</div>
      `).join('');
      
      container.querySelectorAll('.tree-item').forEach(item => {
        item.addEventListener('click', () => {
          selectObject(objects[item.dataset.index]);
        });
      });
    }

    function setupInteractions() {
      const canvas = document.getElementById('viewport-canvas');
      
      canvas.addEventListener('mousedown', onMouseDown);
      canvas.addEventListener('mousemove', onMouseMove);
      canvas.addEventListener('mouseup', onMouseUp);
      canvas.addEventListener('wheel', onWheel);
      
      document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentTool = btn.dataset.tool;
          document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });
      
      document.querySelectorAll('.toolbox-item').forEach(item => {
        item.addEventListener('click', () => {
          createPart(item.dataset.shape);
        });
      });
      
      document.getElementById('save-btn').addEventListener('click', saveMap);
      document.getElementById('publish-btn').addEventListener('click', publishMap);
      document.getElementById('test-btn').addEventListener('click', testMap);
      
      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 's') {
          e.preventDefault();
          saveMap();
        }
      });
    }

    function onMouseDown(e) {
      if (e.button === 2) {
        isDragging = true;
        dragPlane.setFromNormalAndCoplanarPoint(
          new THREE.Vector3(0, 1, 0),
          camera.position
        );
        return;
      }
      
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(
        (e.offsetX / 800) * 2 - 1,
        -(e.offsetY / 600) * 2 + 1
      );
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objects);
      
      if (intersects.length > 0) {
        selectObject(intersects[0].object);
      } else {
        selectObject(null);
      }
    }

    function onMouseMove(e) {
      if (!isDragging) return;
      
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(
        (e.offsetX / 800) * 2 - 1,
        -(e.offsetY / 600) * 2 + 1
      );
      raycaster.setFromCamera(mouse, camera);
      
      const intersection = new THREE.Vector3();
      raycaster.ray.intersectPlane(dragPlane, intersection);
      
      if (selectedObject) {
        selectedObject.position.copy(intersection);
        updateProperties();
      }
    }

    function onMouseUp() {
      isDragging = false;
    }

    function onWheel(e) {
      const zoomSpeed = 0.1;
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      
      if (e.deltaY > 0) {
        camera.position.addScaledVector(dir, -5);
      } else {
        camera.position.addScaledVector(dir, 5);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      
      if (currentTool === 'rotate' && isDragging) {
        // Rotate logic
      }
      
      renderer.render(scene, camera);
    }

    async function saveMap() {
      const mapData = {
        name: 'Untitled',
        version: 1,
        objects: objects.map(obj => ({
          id: obj.uuid,
          type: 'Part',
          name: obj.userData.name,
          position: { x: obj.position.x, y: obj.position.y, z: obj.position.z },
          rotation: { 
            x: THREE.MathUtils.radToDeg(obj.rotation.x),
            y: THREE.MathUtils.radToDeg(obj.rotation.y),
            z: THREE.MathUtils.radToDeg(obj.rotation.z)
          },
          size: { x: obj.scale.x * 2, y: obj.scale.y * 2, z: obj.scale.z * 2 },
          color: '#' + obj.material.color.getHexString(),
          material: 'Plastic',
          anchored: obj.userData.anchored,
          canCollide: obj.userData.canCollide,
          transparency: 0
        })),
        spawnPoints: [{ x: 0, y: 5, z: 0 }],
        ambient: '#404040',
        skyColor: '#87CEEB'
      };
      
      outputLog('Map saved locally');
    }

    async function publishMap() {
      const title = prompt('Game Title:', 'My Game');
      if (!title) return;
      
      const mapData = {
        name: title,
        version: 1,
        objects: objects.map(obj => ({
          id: obj.uuid,
          type: 'Part',
          name: obj.userData.name,
          position: { x: obj.position.x, y: obj.position.y, z: obj.position.z },
          rotation: { x: 0, y: 0, z: 0 },
          size: { x: obj.scale.x, y: obj.scale.y, z: obj.scale.z },
          color: '#' + obj.material.color.getHexString(),
          material: 'Plastic',
          anchored: obj.userData.anchored,
          canCollide: obj.userData.canCollide,
          transparency: 0
        })),
        spawnPoints: [{ x: 0, y: 5, z: 0 }],
        ambient: '#404040',
        skyColor: '#87CEEB'
      };
      
      try {
        const res = await fetch('/api/games', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, map_data: mapData })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          outputLog(`Published: ${title}`);
          window.location.href = `/game.html?id=${data.gameId}`;
        } else {
          outputLog(`Error: ${data.error}`, 'error');
        }
      } catch (err) {
        outputLog(`Error: ${err.message}`, 'error');
      }
    }

    function testMap() {
      const mapData = {
        name: 'Test',
        version: 1,
        objects: objects.map(obj => ({
          id: obj.uuid,
          type: 'Part',
          name: obj.userData.name,
          position: { x: obj.position.x, y: obj.position.y, z: obj.position.z },
          rotation: { x: 0, y: 0, z: 0 },
          size: { x: obj.scale.x, y: obj.scale.y, z: obj.scale.z },
          color: '#' + obj.material.color.getHexString(),
          material: 'Plastic',
          anchored: obj.userData.anchored,
          canCollide: obj.userData.canCollide,
          transparency: 0
        })),
        spawnPoints: [{ x: 0, y: 5, z: 0 }],
        ambient: '#404040',
        skyColor: '#87CEEB'
      };
      
      localStorage.setItem('test_map', JSON.stringify(mapData));
      window.open('/game.html?id=test', '_blank');
    }

    function outputLog(message, type = 'info') {
      const container = document.getElementById('output-content');
      const msg = document.createElement('div');
      msg.className = `output-${type}`;
      msg.textContent = message;
      container.appendChild(msg);
    }

    init();
  </script>
</body>
</html>
