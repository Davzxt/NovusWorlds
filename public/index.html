<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novus Worlds - Create. Play. Explore.</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/games.html">Games</a>
          <a href="/catalog.html">Catalog</a>
          <a href="/forum.html">Forum</a>
          <a href="/about.html">About</a>
        </nav>
        <div class="header-right" id="header-right">
          <div class="logged-out">
            <a href="/login.html" class="btn btn-secondary">Log In</a>
            <a href="/register.html" class="btn btn-primary">Sign Up</a>
          </div>
          <div class="logged-in hidden">
            <span class="novux-balance" id="novux-balance">0 Ƀ</span>
            <div class="dropdown">
              <button class="btn btn-secondary dropdown-toggle" id="header-username">Username</button>
              <div class="dropdown-menu hidden">
                <a href="/profile.html" class="dropdown-item">My Profile</a>
                <a href="/avatar.html" class="dropdown-item">Avatar</a>
                <a href="/studio.html" class="dropdown-item">Studio</a>
                <a href="/admin/" class="dropdown-item admin-link">Admin</a>
                <button id="logout-btn" class="dropdown-item" style="width:100%;border:none;background:none;text-align:left;">Log Out</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="banner">
    <div class="container">
      <h1>Crie. Jogue. Explore.</h1>
      <p>Uma plataforma de jogos infinitos criados por você</p>
    </div>
  </section>

  <main class="main-content">
    <div class="container">
      <section style="margin-bottom: 50px;">
        <h2 class="section-title">Featured Games</h2>
        <div class="game-grid" id="featured-games">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </section>

      <section>
        <h2 class="section-title">Featured Items</h2>
        <div class="card-grid" id="featured-items">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </section>
    </div>
  </main>

<footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-links">
          <a href="/about.html">About</a>
          <a href="/terms.html">Terms</a>
          <a href="/privacy.html">Privacy</a>
          <a href="/forum.html">Forum</a>
        </div>
        <p class="footer-copyright">© 2008 Novus Worlds</p>
      </div>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    async function loadFeaturedGames() {
      try {
        const response = await fetch('/api/games/featured');
        const data = await response.json();
        const container = document.getElementById('featured-games');
        
        if (data.games.length === 0) {
          container.innerHTML = '<p style="color:#fff;">No games yet. Be the first to create one!</p>';
          return;
        }
        
        container.innerHTML = data.games.map(game => `
          <div class="card-item" onclick="window.location.href='/game.html?id=${game.id}'">
            <div class="card-thumbnail">
              ${game.thumbnail_url ? `<img src="${game.thumbnail_url}" alt="${game.title}">` : '<span style="color:#999;">No Image</span>'}
            </div>
            <div class="card-info">
              <div class="card-title">${game.title}</div>
              <div class="card-meta">by ${game.creator_username}</div>
              <div class="card-meta">${game.visit_count} visits</div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('featured-games').innerHTML = '<p style="color:#fff;">Error loading games</p>';
      }
    }

    async function loadFeaturedItems() {
      try {
        const response = await fetch('/api/catalog/featured');
        const data = await response.json();
        const container = document.getElementById('featured-items');
        
        if (data.items.length === 0) {
          container.innerHTML = '<p style="color:#fff;">No items yet.</p>';
          return;
        }
        
        container.innerHTML = data.items.map(item => `
          <div class="card-item" onclick="window.location.href='/item.html?id=${item.id}'">
            <div class="card-thumbnail">
              ${item.thumbnail_url ? `<img src="${item.thumbnail_url}" alt="${item.name}">` : '<span style="color:#999;">No Image</span>'}
            </div>
            <div class="card-info">
              <div class="card-title">${item.name}</div>
              <div class="card-price">${item.price} Ƀ</div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('featured-items').innerHTML = '<p style="color:#fff;">Error loading items</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadFeaturedGames();
      loadFeaturedItems();
    });
  </script>
</body>
</html>
