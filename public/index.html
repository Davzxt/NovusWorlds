<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novus Worlds - Create. Play. Explore.</title>
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/games.html">Games</a>
          <a href="/catalog.html">Catalog</a>
          <a href="/studio.html">Studio</a>
          <a href="/forum.html">Forum</a>
          <a href="/about.html">About</a>
        </nav>
        <div class="header-right" id="header-right">
          <div class="logged-out">
            <a href="/login.html" class="btn btn-secondary">Log In</a>
            <a href="/register.html" class="btn btn-primary">Sign Up</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="banner">
    <div class="container">
      <h1>Crie. Jogue. Explore.</h1>
      <p>A plataforma de jogos online inspirada em 2008</p>
    </div>
  </section>

  <main class="main-content">
    <div class="container">
      <section style="margin-bottom: 50px;">
        <h2 class="section-title">Jogos em Destaque</h2>
        <div class="game-grid" id="featured-games">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </section>

      <section>
        <h2 class="section-title">Itens em Destaque</h2>
        <div class="card-grid" id="featured-items">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-links">
          <a href="/about.html">About</a>
          <a href="/terms.html">Terms</a>
          <a href="/privacy.html">Privacy</a>
          <a href="/forum.html">Forum</a>
          <a href="/contact.html">Contact</a>
        </div>
        <p class="footer-copyright">© 2008 Novus Worlds</p>
      </div>
    </div>
  </footer>

  <script>
    async function loadFeatured() {
      try {
        const resGames = await fetch('/api/games/featured');
        const dataGames = await resGames.json();
        const gamesEl = document.getElementById('featured-games');
        
        if (dataGames.games && dataGames.games.length > 0) {
          gamesEl.innerHTML = dataGames.games.map(g => `
            <div class="card-item" onclick="location.href='/game.html?id=${g.id}'">
              <div class="card-thumbnail">🎮</div>
              <div class="card-info">
                <div class="card-title">${g.title}</div>
                <div class="card-meta">by ${g.creator_username}</div>
                <div class="card-meta">${g.visit_count || 0} visits</div>
              </div>
            </div>
          `).join('');
        } else {
          gamesEl.innerHTML = `
            <div class="card-item" onclick="location.href='/game.html?id=1'">
              <div class="card-thumbnail">🏃</div>
              <div class="card-info">
                <div class="card-title">Test Physics World</div>
                <div class="card-meta">by NovusWorlds</div>
                <div class="card-meta">Test the physics!</div>
              </div>
            </div>
          `;
        }

        const resItems = await fetch('/api/catalog/featured');
        const dataItems = await resItems.json();
        const itemsEl = document.getElementById('featured-items');
        
        if (dataItems.items && dataItems.items.length > 0) {
          itemsEl.innerHTML = dataItems.items.map(i => `
            <div class="card-item" onclick="location.href='/item.html?id=${i.id}'">
              <div class="card-thumbnail">👕</div>
              <div class="card-info">
                <div class="card-title">${i.name}</div>
                <div class="card-price">${i.price} Ƀ</div>
              </div>
            </div>
          `).join('');
        } else {
          itemsEl.innerHTML = `
            <div class="card-item" onclick="location.href='/catalog.html'">
              <div class="card-thumbnail">🧢</div>
              <div class="card-info">
                <div class="card-title">Classic Cap</div>
                <div class="card-price">50 Ƀ</div>
              </div>
            </div>
            <div class="card-item" onclick="location.href='/catalog.html'">
              <div class="card-thumbnail">😎</div>
              <div class="card-info">
                <div class="card-title">Cool Shades</div>
                <div class="card-price">30 Ƀ</div>
              </div>
            </div>
            <div class="card-item" onclick="location.href='/catalog.html'">
              <div class="card-thumbnail">👔</div>
              <div class="card-info">
                <div class="card-title">Formal Shirt</div>
                <div class="card-price">80 Ƀ</div>
              </div>
            </div>
            <div class="card-item" onclick="location.href='/catalog.html'">
              <div class="card-thumbnail">👖</div>
              <div class="card-info">
                <div class="card-title">Blue Jeans</div>
                <div class="card-price">60 Ƀ</div>
              </div>
            </div>
          `;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/session');
        const data = await res.json();
        
        if (data.authenticated) {
          const hr = document.getElementById('header-right');
          hr.innerHTML = `
            <span class="novux-balance">${data.user.novux}</span>
            <div class="dropdown">
              <button class="btn btn-secondary dropdown-toggle" id="user-btn">${data.user.username}</button>
              <div class="dropdown-menu" id="user-menu">
                <a href="/profile.html?user=${data.user.username}" class="dropdown-item">My Profile</a>
                <a href="/avatar.html" class="dropdown-item">My Avatar</a>
                <a href="/studio.html" class="dropdown-item">Studio</a>
                ${data.user.isAdmin ? '<a href="/admin/" class="dropdown-item">Admin Panel</a>' : ''}
                <a href="/settings.html" class="dropdown-item">Settings</a>
                <a href="/friends.html" class="dropdown-item">Friends</a>
                <button id="logout-btn" class="dropdown-item" style="width:100%;border:none;background:none;cursor:pointer;">Log Out</button>
              </div>
            </div>
          `;
          
          document.getElementById('user-btn').addEventListener('click', () => {
            document.getElementById('user-menu').classList.toggle('show');
          });
          
          document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', {method:'POST'});
            location.reload();
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      loadFeatured();
    });
  </script>
</body>
</html>
