<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .forum-category { background: #fff; margin-bottom: 15px; padding: 15px; border-radius: 3px; }
    .forum-topic { padding: 10px; border-bottom: 1px solid #eee; }
    .forum-topic:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>

          <a href="/catalog.html">Catalog</a>
        </nav>
      </div>
    </div>

  <main class="main-content">
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h1 style="color:#fff;">Forum</h1>
        <a href="/login.html" class="btn btn-primary">Sign In to Post</a>
      </div>
      
      <div class="forum-category">
        <h3>General Discussion</h3>
        <div class="forum-topic">
          <p style="color:#666;font-size:11px;">No topics yet. Be the first to post!</p>
        </div>
      </div>
      
      <div class="forum-category">

        <div class="forum-topic">
          <p style="color:#666;font-size:11px;">No topics yet. Be the first to request!</p>

      </div>

        <div class="forum-topic">
          <p style="color:#666;font-size:11px;">No topics yet. Be the first to ask!</p>
