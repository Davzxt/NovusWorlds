<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forum - Novus Worlds</title><link rel="stylesheet" href="/css/global.css"></head><body><div data-header></div><main class="wrap"><section class="panel"><h1>Forum</h1><form id="newThread" class="form"><label class="field"><span>Titulo</span><input name="title" maxlength="80"></label><label class="field"><span>Mensagem</span><textarea name="body" rows="4" maxlength="2000"></textarea></label><button>Criar Topico</button></form></section><section class="panel"><h2>Topicos Recentes</h2><div id="threads"></div></section><section class="panel hidden" id="threadPanel"><button id="backThreads" class="secondary">Voltar</button><div id="threadBody"></div><form id="replyForm"><label class="field"><span>Responder</span><textarea name="body" rows="3" maxlength="2000"></textarea></label><button>Responder</button></form></section></main><script type="module">import{api,toast,esc}from'/js/main.js';let current=null;async function load(){const r=await api('/api/forum/threads');threads.innerHTML=r.threads.map(t=>`<div class="card"><h3><a href="#" data-id="${t.id}">${esc(t.title)}</a></h3><p>${esc(t.body).slice(0,180)}</p><p class="muted">por ${esc(t.username)} - ${t.replies} respostas</p></div>`).join('')||'<p>Nenhum topico ainda.</p>'}threads.onclick=e=>{if(e.target.dataset.id){e.preventDefault();openThread(e.target.dataset.id)}};async function openThread(id){current=id;const r=await api('/api/forum/threads/'+id);threadPanel.classList.remove('hidden');threadBody.innerHTML=`<h2>${esc(r.thread.title)}</h2><p class="muted">por ${esc(r.thread.username)}</p><p>${esc(r.thread.body)}</p><h3>Respostas</h3>`+r.posts.map(p=>`<div class="card"><b>${esc(p.username)}</b><p>${esc(p.body)}</p></div>`).join('')}newThread.onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/forum/threads',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(newThread)))});newThread.reset();await load();openThread(r.id)}catch(err){toast(err.message)}};replyForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/forum/threads/'+current+'/posts',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(replyForm)))});replyForm.reset();openThread(current)}catch(err){toast(err.message)}};backThreads.onclick=()=>threadPanel.classList.add('hidden');load();</script></body></html>
