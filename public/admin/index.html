<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    body { background: #f5f5f5; }
    .admin-layout { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 220px; background: #1a4a8a; color: #fff; padding: 20px 0; }
    .admin-sidebar h2 { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .admin-sidebar a { display: block; padding: 12px 20px; color: #fff; transition: background 0.2s; }
    .admin-sidebar a:hover, .admin-sidebar a.active { background: rgba(255,255,255,0.1); }
    .admin-main { flex: 1; padding: 30px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #fff; padding: 20px; border-radius: 3px; border: 1px solid #ddd; }
    .stat-value { font-size: 28px; font-weight: bold; color: #1a4a8a; }
    .stat-label { color: #666; font-size: 12px; text-transform: uppercase; }
    .chart-container { background: #fff; padding: 20px; border-radius: 3px; border: 1px solid #ddd; }
    .chart-bar { display: flex; align-items: flex-end; gap: 10px; height: 150px; }
    .chart-bar-item { flex: 1; background: #2196F3; border-radius: 3px 3px 0 0; min-height: 10px; }
    .activity-list { background: #fff; padding: 20px; border-radius: 3px; border: 1px solid #ddd; }
    .activity-item { padding: 10px 0; border-bottom: 1px solid #eee; }
    .activity-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <div class="admin-sidebar">
      <h2>Admin Panel</h2>
      <a href="/admin/" class="active">Dashboard</a>
      <a href="/admin/users.html">Users</a>
      <a href="/admin/games.html">Games</a>
      <a href="/admin/catalog.html">Catalog</a>
      <a href="/admin/economy.html">Economy</a>
      <a href="/admin/reports.html">Reports</a>
      <a href="/admin/settings.html">Settings</a>
      <a href="/">Back to Site</a>
    </div>

    <div class="admin-main">
      <h1 style="margin-bottom: 30px;">Dashboard</h1>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="total-users">-</div>
          <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="active-users">-</div>
          <div class="stat-label">Online Now</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-games">-</div>
          <div class="stat-label">Total Games</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-items">-</div>
          <div class="stat-label">Catalog Items</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-novux">-</div>
          <div class="stat-label">Novux in Circulation</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="pending-reports">-</div>
          <div class="stat-label">Pending Reports</div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="chart-container">
          <h3 style="margin-bottom: 15px;">Registrations (Last 7 Days)</h3>
          <div class="chart-bar" id="registrations-chart"></div>
        </div>

        <div class="activity-list">
          <h3 style="margin-bottom: 15px;">Recent Activity</h3>
          <div id="activity-feed"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadStats() {
      const res = await fetch('/api/admin/stats');
      const data = await res.json();

      document.getElementById('total-users').textContent = data.totalUsers;
      document.getElementById('active-users').textContent = data.activeUsers;
      document.getElementById('total-games').textContent = data.totalGames;
      document.getElementById('total-items').textContent = data.totalItems;
      document.getElementById('total-novux').textContent = data.totalNovux.toLocaleString();
      document.getElementById('pending-reports').textContent = data.pendingReports;

      const maxCount = Math.max(...data.last7Days.map(d => d.count), 1);
      document.getElementById('registrations-chart').innerHTML = data.last7Days.map(d => {
        const height = (d.count / maxCount) * 100;
        return `<div class="chart-bar-item" style="height:${height}%;" title="${d.date}: ${d.count}"></div>`;
      }).join('');
    }

    loadStats();
  </script>
</body>
</html>
