<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Usuarios Admin</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/admin.css"></head><body class="admin-page"><div class="admin-shell"><nav class="admin-nav"><a href="/admin/index.html">Dashboard</a><a href="/admin/catalog.html">Catalogo</a></nav><main class="admin-main"><h1>Usuarios</h1><input id="q" placeholder="Buscar username"><div id="out" class="panel"></div></main></div><script type="module">import{api}from'/js/main.js';async function load(){const r=await api('/api/admin/users?q='+q.value);out.innerHTML='<table class="table"><tr><th>Username</th><th>Registro</th><th>Status</th><th>Novux</th><th>Acoes</th></tr>'+r.users.map(u=>`<tr><td>${u.username}</td><td>${u.created_at}</td><td>${u.is_banned?'Banido':'Ativo'}</td><td>${u.novux}</td><td><button data-a="ban" data-id="${u.id}">Banir</button><button data-a="unban" data-id="${u.id}">Desbanir</button><button data-a="promote" data-id="${u.id}">Admin</button><button data-a="novux" data-id="${u.id}">+100</button><a class="btn secondary" href="/profile.html?user=${u.username}">Perfil</a></td></tr>`).join('')+'</table>'}out.onclick=async e=>{if(!e.target.dataset.id)return;await api('/api/admin/users/'+e.target.dataset.id+'/action',{method:'POST',body:JSON.stringify({action:e.target.dataset.a,amount:100,duration:'+7 days'})});load()};q.oninput=load;load();</script></body></html>
