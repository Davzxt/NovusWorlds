<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogo Admin - Novus Worlds</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/admin.css"></head><body class="admin-page"><div class="admin-shell"><nav class="admin-nav"><h2>Novus Admin</h2><a href="/admin/index.html">Dashboard</a><a href="/admin/users.html">Usuarios</a><a href="/admin/games.html">Jogos</a><a href="/admin/catalog.html">Catalogo</a><a href="/admin/economy.html">Economia</a><a href="/admin/reports.html">Denuncias</a><a href="/admin/settings.html">Configuracoes</a></nav><main class="admin-main"><h1>Gerenciar Catalogo</h1><button id="openAdd">+ Adicionar Item</button><section class="panel" id="items"></section></main></div><div id="modal" class="modal hidden"><div class="modal-box"><form id="addForm" class="modal-form"><h2>Adicionar Item</h2><label class="field"><span>Nome do Item</span><input name="name" required></label><label class="field"><span>Descricao</span><textarea name="description"></textarea></label><label class="field"><span>Tipo</span><select name="type"><option value="hat">Chapeu</option><option value="face">Rosto</option><option value="shirt">Camisa</option><option value="pants">Calca</option></select></label><label class="field"><span>Preco em Novux</span><input name="price" type="number" min="0" value="0"></label><label><input name="is_limited" type="checkbox" value="1"> Limitado</label><label class="field"><span>Quantidade Limitada</span><input name="limited_quantity" type="number"></label><label class="field"><span>Upload de Textura/Imagem</span><input name="asset" type="file" accept="image/png,image/jpeg"></label><label class="field"><span>Modelo 3D do Chapeu</span><input name="model" type="file" accept=".obj,.gltf,.glb"></label><h3>Transform do Chapeu</h3><div id="controls"></div><button type="button" id="reset" class="secondary">Resetar Transform</button> <button type="button" id="fitHead" class="secondary">Encaixar na Cabeca</button><p><button>Salvar Item</button> <button type="button" id="cancel" class="danger">Cancelar</button></p></form><div class="preview3d"><div id="hatPreview" style="height:100%"></div></div></div></div><script>const c=document.getElementById('controls');for(const g of['position','rotation','scale'])for(const k of['x','y','z']){const min=g==='scale'?0.1:g==='rotation'?0:-5,max=g==='scale'?5:g==='rotation'?360:5,step=g==='rotation'?1:.05;c.insertAdjacentHTML('beforeend',`<div class="slider-row"><label>${g} ${k.toUpperCase()}</label><input data-t="${g}.${k}" type="range" min="${min}" max="${max}" step="${step}"><input data-n="${g}.${k}" type="number" step="${step}"></div>`)}</script><script type="module" src="/js/admin/catalog-admin.js"></script></body></html>
