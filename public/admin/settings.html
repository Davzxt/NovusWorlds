<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Configuracoes Admin</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/admin.css"></head><body class="admin-page"><div class="admin-shell"><nav class="admin-nav"><a href="/admin/index.html">Dashboard</a><a href="/admin/catalog.html">Catalogo</a></nav><main class="admin-main"><h1>Configuracoes</h1><form id="f" class="panel form"><label class="field"><span>Nome da plataforma</span><input name="platform_name" value="Novus Worlds"></label><label class="field"><span>Bonus de registro</span><input name="register_bonus" type="number" value="100"></label><label class="field"><span>Banner global</span><input name="global_banner"></label><button>Salvar</button></form></main></div><script type="module">import{api,toast}from'/js/main.js';f.onsubmit=async e=>{e.preventDefault();await api('/api/admin/settings',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});toast('Configuracoes salvas.')}</script></body></html>
