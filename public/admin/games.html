<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Jogos Admin</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/admin.css"></head><body class="admin-page"><div class="admin-shell"><nav class="admin-nav"><a href="/admin/index.html">Dashboard</a><a href="/admin/catalog.html">Catalogo</a></nav><main class="admin-main"><h1>Jogos</h1><div id="out" class="panel"></div></main></div><script type="module">import{api}from'/js/main.js';async function load(){const r=await api('/api/admin/games');out.innerHTML='<table class="table"><tr><th>Nome</th><th>Criador</th><th>Visitas</th><th>Status</th><th>Acoes</th></tr>'+r.games.map(g=>`<tr><td>${g.title}</td><td>${g.creator}</td><td>${g.visit_count}</td><td>${g.is_active?'Ativo':'Off'}</td><td><button data-a="feature" data-id="${g.id}">Destacar</button><button data-a="disable" data-id="${g.id}">Desativar</button><button data-a="enable" data-id="${g.id}">Reativar</button><a class="btn secondary" href="/studio.html?id=${g.id}">Studio</a></td></tr>`).join('')+'</table>'}out.onclick=async e=>{if(!e.target.dataset.id)return;await api('/api/admin/games/'+e.target.dataset.id+'/action',{method:'POST',body:JSON.stringify({action:e.target.dataset.a})});load()};load();</script></body></html>
