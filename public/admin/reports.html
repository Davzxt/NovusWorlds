<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Denuncias Admin</title><link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/admin.css"></head><body class="admin-page"><div class="admin-shell"><nav class="admin-nav"><a href="/admin/index.html">Dashboard</a><a href="/admin/catalog.html">Catalogo</a></nav><main class="admin-main"><h1>Denuncias</h1><div id="out" class="panel"></div></main></div><script type="module">import{api}from'/js/main.js';const r=await api('/api/admin/reports');out.innerHTML='<table class="table"><tr><th>ID</th><th>Tipo</th><th>Motivo</th><th>Status</th></tr>'+r.reports.map(x=>`<tr><td>${x.id}</td><td>${x.content_type}</td><td>${x.reason}</td><td>${x.status}</td></tr>`).join('')+'</table>';</script></body></html>
