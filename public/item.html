<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item - Novus Worlds</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    .item-container { max-width: 800px; margin: 30px auto; }
    .item-preview { width: 100%; height: 300px; background: linear-gradient(180deg, #87CEEB 0%, #e0e0e0 100%); border-radius: 3px; margin-bottom: 20px; }
    .item-details { background: #fff; padding: 20px; border-radius: 3px; }
    .item-price { font-size: 24px; color: var(--novux-color); font-weight: bold; }
    .item-actions { display: flex; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">Novus <span>Worlds</span></a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/games.html">Games</a>
          <a href="/catalog.html">Catalog</a>
        </nav>
        <div class="header-right">
          <a href="/login.html" class="btn btn-secondary">Log In</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="item-container">
        <div class="item-preview" id="item-preview"></div>
        <div class="item-details">
          <h1 id="item-name" style="margin-bottom: 10px;"></h1>
          <p id="item-description" style="color: #666; margin-bottom: 15px;"></p>
          <p>Type: <span id="item-type"></span></p>
          <p>Creator: <a id="item-creator"></a></p>
          <p style="margin-top: 15px;" class="item-price"><span id="item-price"></span> Ƀ</p>
          
          <div class="item-actions">
            <button id="buy-btn" class="btn btn-primary">Buy</button>
            <button id="try-btn" class="btn btn-secondary">Try On</button>
          </div>
          
          <div id="buy-message" style="margin-top: 15px;"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const itemId = new URLSearchParams(window.location.search).get('id');

    async function loadItem() {
      if (!itemId) {
        window.location.href = '/catalog.html';
        return;
      }
      
      try {
        const response = await fetch(`/api/catalog/${itemId}`);
        const data = await response.json();
        
        if (!response.ok) {
          window.location.href = '/catalog.html';
          return;
        }
        
        const item = data.item;
        document.title = `${item.name} - Novus Worlds`;
        document.getElementById('item-name').textContent = item.name;
        document.getElementById('item-description').textContent = item.description || 'No description';
        document.getElementById('item-type').textContent = item.type;
        document.getElementById('item-creator').textContent = item.creator_username;
        document.getElementById('item-price').textContent = item.price;
        
        if (item.thumbnail_url) {
          document.getElementById('item-preview').innerHTML = `<img src="${item.thumbnail_url}" style="width:100%;height:100%;object-fit:contain;">`;
        }
      } catch (error) {
        window.location.href = '/catalog.html';
      }
    }

    async function buyItem() {
      const response = await fetch('/api/auth/session');
      const session = await response.json();
      
      if (!session.authenticated) {
        window.location.href = '/login.html';
        return;
      }
      
      try {
        const buyRes = await fetch('/api/catalog/buy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemId })
        });
        
        const result = await buyRes.json();
        
        if (buyRes.ok) {
          showToast('Item purchased!', 'success');
          document.getElementById('buy-btn').textContent = 'Owned';
          document.getElementById('buy-btn').disabled = true;
        } else {
          document.getElementById('buy-message').innerHTML = `<span style="color:red;">${result.error}</span>`;
        }
      } catch (error) {
        showToast('Purchase failed', 'error');
      }
    }

    function showToast(message, type) {
      const container = document.querySelector('.toast-container') || document.createElement('div');
      container.className = 'toast-container';
      document.body.appendChild(container);
      
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => toast.remove(), 3000);
    }

    document.getElementById('buy-btn').addEventListener('click', buyItem);
    document.addEventListener('DOMContentLoaded', loadItem);
  </script>
</body>
</html>
